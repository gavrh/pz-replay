plugins {
    id 'java'
}

group = 'com.gavrh'
version = '0.0.0-dev'
def generatedBuildInfoDir = layout.buildDirectory.dir('generated/buildInfo')
def buildVersion = version.toString()

def localProperties = new Properties()
def localPropertiesFile = file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}

def gameDir = localProperties.getProperty('gameDir') ?: System.getenv('PZ_GAME_DIR')
def gameJar = gameDir ? file("${gameDir}/projectzomboid/projectzomboid.jar") : null
def zombieBuddyJar = gameDir ? file("${gameDir}/projectzomboid/ZombieBuddy.jar") : null

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

sourceSets {
    core {
        java {
            srcDirs = ['src/core/java']
        }
        resources {
            srcDir generatedBuildInfoDir
        }
    }

    b42 {
        java {
            srcDirs = ['src/b42/java']
        }
        compileClasspath += sourceSets.core.output
        runtimeClasspath += sourceSets.core.output
    }

    test {
        java {
            srcDirs = ['src/test/java']
        }
        compileClasspath += sourceSets.core.output
        runtimeClasspath += sourceSets.core.output
    }
}

tasks.register('generateBuildInfo') {
    inputs.property('version', buildVersion)
    outputs.dir(generatedBuildInfoDir)
    doLast {
        def file = new File(
            generatedBuildInfoDir.get().asFile,
            'com/gavrh/pzreplay/build-info.properties'
        )
        file.parentFile.mkdirs()
        file.text = "version=${buildVersion}\n"
    }
}

tasks.named('processCoreResources') {
    dependsOn 'generateBuildInfo'
}

dependencies {
    if (gameJar != null && zombieBuddyJar != null) {
        b42CompileOnly files(gameJar, zombieBuddyJar)
    }

    testImplementation 'org.junit.jupiter:junit-jupiter:6.1.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:6.1.3'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('compileB42Java') {
    doFirst {
        if (gameJar == null || !gameJar.exists() || zombieBuddyJar == null || !zombieBuddyJar.exists()) {
            throw new GradleException(
                'Project Zomboid or ZombieBuddy jar not found. ' +
                'Set gameDir in local.properties (see local.properties.example).'
            )
        }
    }
}

tasks.register('b42Jar', Jar) {
    group = 'build'
    description = 'Build the Project Zomboid mod jar.'
    dependsOn sourceSets.core.classesTaskName, sourceSets.b42.classesTaskName
    archiveFileName = 'PZReplay.jar'
    destinationDirectory = layout.buildDirectory.dir('libs')
    from sourceSets.core.output
    from sourceSets.b42.output
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes('Implementation-Version': project.version)
    }
}

tasks.register('stageMod', Sync) {
    group = 'build'
    description = 'Stage the B42 mod tree with the built jar.'
    dependsOn tasks.named('b42Jar')
    into layout.buildDirectory.dir('mod')
    from('mod')
    from(tasks.named('b42Jar')) {
        into 'Contents/mods/pz-replay/42/media/java'
    }
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.named('jar') {
    enabled = false
}

tasks.named('assemble') {
    dependsOn 'b42Jar'
}

tasks.named('build') {
    dependsOn 'stageMod'
}
